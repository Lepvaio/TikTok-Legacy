
name: Build TikTok Legacy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TikTok-Legacy-0.2-Gateway-Logo-Source.zip'
      - 'TikTokLegacy-GitHub-Actions.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Không tìm thấy sdkmanager!"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Extract source
        run: |
          mkdir -p extracted

          if [ -f TikTokLegacy-starter.zip ]; then
            unzip -q TikTokLegacy-starter.zip -d extracted
          elif [ -f TikTokLegacy-GitHub-Actions.zip ]; then
            unzip -q TikTokLegacy-GitHub-Actions.zip -d extracted
          else
            echo "Không tìm thấy file ZIP source!"
            exit 1
          fi

      - name: Find project folder
        run: |
          if [ -f extracted/TikTokLegacy/settings.gradle ]; then
            echo "PROJECT_DIR=extracted/TikTokLegacy" >> "$GITHUB_ENV"
          elif [ -f extracted/settings.gradle ]; then
            echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"
          else
            echo "Không tìm thấy settings.gradle!"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokLegacy-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
