
name: Build TikTok Legacy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TikTokLegacy-starter.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Extract source
        run: |
          unzip -q TikTokLegacy-starter.zip -d extracted

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Build APK
        working-directory: extracted/TikTokLegacy
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokLegacy-debug-apk
          path: extracted/TikTokLegacy/app/build/outputs/apk/debug/app-debug.apk
